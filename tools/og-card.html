<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../ds/tokens/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
       background:radial-gradient(900px 500px at 50% -20%, rgba(34,211,238,.10), transparent 60%), #05080d;
       color:#d7e6ef;font-family:"Alliance No.1",sans-serif;font-weight:300;
       display:flex;flex-direction:column;justify-content:center;padding:0 84px}
  .eyebrow{font-family:"Alliance No.2",sans-serif;font-size:20px;letter-spacing:.22em;color:#22d3ee;margin-bottom:26px}
  h1{font-size:62px;font-weight:300;line-height:1.1;letter-spacing:-.015em;color:#eaf5fb}
  p{margin-top:22px;font-size:25px;line-height:1.45;color:#94a3b8}
  .wrap{display:flex;align-items:center;gap:64px}
  .left{width:470px;flex:none}
  table{border-collapse:collapse;font-variant-numeric:tabular-nums;flex:none}
  thead td{font-family:"Alliance No.2",sans-serif;font-size:16px;letter-spacing:.14em;color:#7b91a3;
           padding:0 0 10px;border-bottom:1px solid rgba(34,211,238,.55)}
  tbody td{font-size:24px;padding:13px 0;border-bottom:1px solid rgba(34,211,238,.14);color:#d7e6ef}
  .n{text-align:right;padding-left:34px}
  .k{color:#22d3ee}
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="eyebrow">OPENDIET.ORG</div>
      <h1>Macro search,<br>not a diet app.</h1>
      <p>Compare any two foods on protein, carbs, fat and calories.</p>
    </div>
    <table>
      <thead><tr><td>FOOD</td><td class="n">PROT</td><td class="n">CARB</td><td class="n">FAT</td><td class="n">KCAL</td></tr></thead>
      <tbody>
        <tr><td>Chicken breast, raw</td><td class="n">23</td><td class="n">—</td><td class="n">1.2</td><td class="n k">114</td></tr>
        <tr><td>Lentils, raw</td><td class="n">25</td><td class="n">63</td><td class="n">1.1</td><td class="n k">352</td></tr>
        <tr><td>Broccoli, raw</td><td class="n">2.8</td><td class="n">6.6</td><td class="n">0.4</td><td class="n k">34</td></tr>
        <tr><td>Almonds</td><td class="n">21</td><td class="n">22</td><td class="n">50</td><td class="n k">579</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
